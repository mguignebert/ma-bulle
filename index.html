<style>
:root{
  --bg1:#1a1433; --bg2:#22305a; --card:rgba(255,255,255,.07); --card2:rgba(255,255,255,.12);
  --line:rgba(255,255,255,.14); --txt:#f3f0ff; --mute:#b9b3d6; --acc:#7fe0d0; --acc2:#b79bff; --warm:#ffb38a; --sos:#ff6b8b;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--bg1);color:var(--txt);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{background:radial-gradient(1200px 700px at 80% -10%,#3a2c74 0,transparent 60%),radial-gradient(900px 600px at -10% 110%,#16455a 0,transparent 60%),linear-gradient(180deg,var(--bg1),var(--bg2));background-attachment:fixed}
main{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 14px) 16px 110px}
h1{font-size:26px;margin:6px 0 2px;letter-spacing:.2px} h2{font-size:20px;margin:18px 0 8px} h3{font-size:17px;margin:0 0 6px}
p{margin:8px 0} .mute{color:var(--mute)} .small{font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;margin:12px 0;backdrop-filter:blur(6px)}
.row{display:flex;gap:10px;align-items:center} .grow{flex:1}
.btn{appearance:none;border:0;border-radius:14px;padding:13px 16px;font:600 16px system-ui,sans-serif;color:#141029;background:var(--acc);cursor:pointer;width:100%;margin-top:10px}
.btn.alt{background:var(--card2);color:var(--txt);border:1px solid var(--line)} .btn.soft{background:var(--acc2)} .btn.warm{background:var(--warm)} .btn.sos{background:var(--sos);color:#fff}
.btn:active{transform:scale(.98)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.chip{border:1px solid var(--line);background:var(--card);color:var(--txt);border-radius:999px;padding:8px 12px;font-size:14px;cursor:pointer}
.chip.on{background:var(--acc);color:#141029;border-color:transparent;font-weight:600}
textarea,input[type=text],input[type=tel],input[type=password],input[type=time]{width:100%;background:rgba(0,0,0,.22);color:var(--txt);border:1px solid var(--line);border-radius:12px;padding:11px 12px;font:15px system-ui,sans-serif;margin-top:6px}
textarea{min-height:84px;resize:vertical} label{display:block;margin-top:12px;font-size:14px;color:var(--mute)}
input[type=range]{width:100%;accent-color:var(--acc)}
body.miku{--bg1:#0d1416;--bg2:#141d22;--card:rgba(57,197,187,.08);--card2:rgba(57,197,187,.16);--line:rgba(57,197,187,.28);--txt:#eefcfb;--mute:#9fc9c5;--acc:#39c5bb;--acc2:#e12885;--warm:#86e3dc;
  background:radial-gradient(900px 600px at 85% -10%,rgba(57,197,187,.28) 0,transparent 60%),radial-gradient(700px 500px at -10% 110%,rgba(225,40,133,.18) 0,transparent 60%),linear-gradient(180deg,var(--bg1),var(--bg2));background-attachment:fixed}
body.miku .btn.soft{color:#fff} body.miku .bubble{background:radial-gradient(circle at 35% 30%,#ffffffcc,#39c5bb 40%,#137a72 100%);box-shadow:0 0 60px rgba(57,197,187,.6)}
body.miku nav.bar{background:rgba(10,16,18,.94)} body.miku .chip.on{background:var(--acc)}
body.miku h1::after{content:" ♪";color:var(--acc2)}
body.miku .card{border-image:none}
body.miku .sos-wrap{background:linear-gradient(180deg,#10262a,#0d1416)} body.miku .lock{background:#0d1416}
.notes{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden;display:none} body.miku .notes{display:block}
.notes span{position:absolute;bottom:-40px;color:rgba(57,197,187,.25);font-size:22px;animation:up 14s linear infinite}
@keyframes up{to{transform:translateY(-110vh) rotate(25deg);opacity:0}}
main{position:relative;z-index:1}
.mascot{display:flex;align-items:flex-end;gap:6px;margin:4px 0 2px}
.mascot img{width:118px;height:auto;flex:none;filter:drop-shadow(0 6px 14px rgba(57,197,187,.35));animation:bob 3.2s ease-in-out infinite}
.mascot .say{position:relative;background:var(--card2);border:1px solid var(--line);border-radius:18px;padding:12px 14px;margin-bottom:34px;font-size:15px}
.mascot .say::before{content:"";position:absolute;left:-9px;bottom:16px;border:9px solid transparent;border-right-color:var(--line);border-left:0}
@keyframes bob{50%{transform:translateY(-6px)}}
.lvlup{position:fixed;inset:0;z-index:35;display:grid;place-items:center;background:rgba(5,10,12,.82);padding:20px;text-align:center}
.lvlup img{width:220px;animation:jump .9s ease-in-out infinite}
@keyframes jump{50%{transform:translateY(-16px) rotate(-3deg)}}
nav.bar{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;background:rgba(20,15,40,.92);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom));backdrop-filter:blur(10px);z-index:5}
nav.bar button{flex:1;max-width:140px;background:none;border:0;color:var(--mute);font:600 12px system-ui,sans-serif;padding:6px 0;cursor:pointer}
nav.bar button .i{display:block;font-size:22px;line-height:1.2} nav.bar button.on{color:var(--acc)}
.sosfab{position:fixed;right:14px;top:calc(env(safe-area-inset-top) + 12px);z-index:6;background:var(--sos);color:#fff;border:0;border-radius:999px;padding:9px 14px;font:700 14px system-ui,sans-serif;box-shadow:0 6px 20px rgba(255,107,139,.4);cursor:pointer}
.mods .mod{margin:14px 0}
.step{display:flex;gap:12px;align-items:center;padding:11px 12px;border-radius:14px;background:var(--card);border:1px solid var(--line);margin:8px 0;cursor:pointer}
.step .n{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--card2);font-weight:700;font-size:14px;flex:none}
.step.done .n{background:var(--acc);color:#141029} .step.lock{opacity:.45;cursor:default}
.bar2{height:8px;border-radius:9px;background:rgba(255,255,255,.1);overflow:hidden} .bar2 i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--acc2))}
.meteo{display:flex;justify-content:space-between;gap:6px;margin-top:8px} .meteo button{flex:1;font-size:28px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px 0;cursor:pointer}
.meteo button.on{background:var(--acc2);border-color:transparent}
.breath{display:grid;place-items:center;height:280px;position:relative}
.bubble{width:120px;height:120px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffffffcc,var(--acc) 40%,#3aa89a 100%);box-shadow:0 0 60px rgba(127,224,208,.5);transition:transform linear}
.bword{position:absolute;bottom:0;font-size:20px;font-weight:700}
.big{font-size:44px;font-weight:800;text-align:center;margin:8px 0}
.sos-wrap{position:fixed;inset:0;background:linear-gradient(180deg,#2a1838,#1a1433);z-index:20;overflow:auto;padding:calc(env(safe-area-inset-top) + 16px) 16px 30px}
.sos-wrap .inner{max-width:560px;margin:0 auto}
.tel{display:flex;justify-content:space-between;align-items:center;text-decoration:none;color:var(--txt);background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:8px 0}
.tel b{font-size:16px} .tel span{font-size:13px;color:var(--mute)}
.lock{position:fixed;inset:0;background:var(--bg1);z-index:30;display:grid;place-items:center;padding:20px}
.pin{display:flex;gap:10px;justify-content:center;margin:14px 0} .pin i{width:16px;height:16px;border-radius:50%;border:2px solid var(--acc)} .pin i.f{background:var(--acc)}
.pad{display:grid;grid-template-columns:repeat(3,72px);gap:12px;justify-content:center} .pad button{height:64px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--txt);font:600 24px system-ui;cursor:pointer}
.entry{border-left:3px solid var(--acc2);padding:4px 0 4px 12px;margin:12px 0}
canvas{width:100%;height:150px}
.hidden{display:none!important}
.bubble.slow{animation:breathe 10s ease-in-out infinite;animation-play-state:paused} .bubble.slow.on{animation-play-state:running}
@keyframes breathe{50%{transform:scale(1.55)}}
.stxt{min-height:84px;font-size:19px;line-height:1.45;padding:0 6px;transition:opacity .6s}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0} .quick .btn{margin:0}
details.card summary{cursor:pointer;list-style:none} details.card summary::-webkit-details-marker{display:none}
details.card summary::after{content:" ›";color:var(--mute)} details.card[open] summary{margin-bottom:6px}
.badge{display:inline-block;font-size:12px;padding:2px 8px;border-radius:999px;background:var(--card2);color:var(--mute)}
</style>
</head>
<body>
<button class="sosfab" id="sosfab" onclick="openSOS()">🆘 SOS</button>
<div class="notes"><span style="left:8%;animation-delay:0s">♪</span><span style="left:26%;animation-delay:4s">♫</span><span style="left:48%;animation-delay:8s">♪</span><span style="left:70%;animation-delay:2s">♬</span><span style="left:88%;animation-delay:10s">♫</span></div>
<main id="app"></main>
<nav class="bar" id="nav">
  <button data-v="home"><span class="i">🫧</span>Accueil</button>
  <button data-v="path"><span class="i">🧭</span>Parcours</button>
  <button data-v="journal"><span class="i">📔</span>Journal</button>
  <button data-v="progress"><span class="i">🌱</span>Progrès</button>
  <button data-v="settings"><span class="i">⚙️</span>Moi</button>
</nav>
<div id="sos" class="sos-wrap hidden"></div>
<div id="lock" class="lock hidden"></div>
<script src="voix/voix.js"></script>
<script src="seances/seances.js"></script>

<script>
if (typeof SEANCES === "undefined") window.SEANCES = {};
/* Ma Bulle — trousse émotionnelle et parcours pour apprendre à gérer ses émotions.
   Tout reste sur le téléphone (localStorage), rien n'est envoyé nulle part. Ne remplace pas un suivi par un psy. */
const K = "maBulle.v1";
const S = Object.assign({ theme: "miku", name: "", trustName: "", trustTel: "", pin: "", done: {}, ans: {}, mood: {}, journal: [], box: [], plan: {}, wins: {}, day: {}, defi: {}, music: "", seance: "" }, (() => { try { return JSON.parse(localStorage.getItem(K)) || {}; } catch (e) { return {}; } })());
const save = () => { try { localStorage.setItem(K, JSON.stringify(S)); } catch (e) {} };
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
// date du jour en heure locale (toISOString donnait la date UTC : entre minuit et 1-2 h, c'était encore « hier »)
const ymd = d => d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
const today = () => ymd(new Date());
const fmtD = d => new Date(d + "T12:00").toLocaleDateString("fr-FR", { weekday: "short", day: "numeric", month: "short" });
const vib = ms => { try { navigator.vibrate && navigator.vibrate(ms); } catch (e) {} };

// voix qui guide les exercices : phrases enregistrées à l'avance (voix féminine douce, fichiers dans voix/,
// marchent hors connexion). Si une phrase n'a pas d'enregistrement, on se rabat sur une voix féminine du téléphone.
const VA = typeof Audio !== "undefined" ? new Audio() : null;
const SA = typeof Audio !== "undefined" ? new Audio() : null;   // lecteur des séances audio
const SYN = "speechSynthesis" in window;
const VOICE = { ok: !!VA || SYN, v: null };
const MALE = /thomas|paul|henri|nicolas|claude|daniel|antoine|jean|thierry|fabrice|gerard|gérard|remy|rémy|male|homme/i;
function pickVoice() { if (!SYN) return; const vs = speechSynthesis.getVoices().filter(v => /^fr/i.test(v.lang) && !MALE.test(v.name));
  VOICE.v = vs.find(v => /audrey|amelie|amélie|marie|aurelie|aurélie|vivienne|denise|julie|hortense|female|femme/i.test(v.name)) || vs.find(v => /fr-FR/i.test(v.lang)) || vs[0] || null; }
if (SYN) { pickVoice(); try { speechSynthesis.onvoiceschanged = pickVoice; } catch (e) {} }
function synth(t) {
  if (!SYN) return;
  try { speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(String(t).replace(/…/g, ".")); u.lang = "fr-FR"; if (VOICE.v) u.voice = VOICE.v; u.rate = .85; u.pitch = 1.1; speechSynthesis.speak(u); } catch (e) {}
}
function say(t) {
  if (S.voice === false || !t) return;
  const f = typeof VOIX !== "undefined" && VOIX[String(t).trim()];
  if (f && VA) { try { if (SYN) speechSynthesis.cancel(); VA.pause(); VA.src = f; const p = VA.play(); if (p && p.catch) p.catch(() => synth(t)); return; } catch (e) {} }
  synth(t);
}
const hush = () => { try { if (VA) VA.pause(); if (SA && !SA.paused) SA.pause(); if (SYN) speechSynthesis.cancel(); } catch (e) {} };
function voiceChip() { return VOICE.ok ? `<button class="chip ${S.voice !== false ? "on" : ""}" onclick="toggleVoice(this)">${S.voice !== false ? "🔊 Voix activée" : "🔇 Voix coupée"}</button>` : ""; }
function toggleVoice(b) { S.voice = S.voice === false; save(); if (S.voice === false) hush(); else say("Je suis là. Je te guide.");
  if (b) { b.classList.toggle("on", S.voice !== false); b.textContent = S.voice !== false ? "🔊 Voix activée" : "🔇 Voix coupée"; } }

// ---------------------------------------------------------------- le parcours
const MODS = [
  { t: "Comprendre mes émotions", ic: "🌊" }, { t: "Calmer mon corps", ic: "🌬️" }, { t: "Traverser une crise", ic: "⛵" },
  { t: "Apprivoiser mes pensées", ic: "🧠" }, { t: "Prendre soin de moi", ic: "💜" },
];
const EMOS = ["Triste", "En colère", "Angoissée", "Stressée", "Seule", "Vide", "Honteuse", "Jalouse", "Frustrée", "Déçue", "Perdue", "Épuisée", "Blessée", "Rejetée", "Nerveuse", "Agacée", "Calme", "Contente", "Fière", "Soulagée", "Joyeuse", "Reconnaissante", "Apaisée", "Motivée"];
const STEPS = [
  { m: 0, t: "Les émotions, c'est comme des vagues", why: "Une émotion monte, atteint un pic, puis redescend. Si on ne la nourrit pas, la vague passe souvent en quelques minutes. Savoir ça, c'est déjà moins avoir peur de ses émotions.",
    ex: { k: "read", txt: "Repense à une fois où une émotion forte est montée puis est retombée. Tu n'as rien à faire de parfait ici, juste observer.", q: ["Qu'est-ce qui a déclenché la vague ?", "Comment elle est montée dans ton corps ?", "Qu'est-ce qui l'a fait redescendre, même un peu ?"] } },
  { m: 0, t: "Mon thermomètre", why: "Mettre un chiffre de 0 à 10 sur ce qu'on ressent aide à voir la crise arriver avant qu'elle soit trop haute. Plus on la repère tôt, plus c'est facile de la calmer.",
    ex: { k: "read", txt: "Décris à quoi ressemble chaque niveau pour toi. Ce sera ton thermomètre personnel.", q: ["À 2-3 sur 10, je suis…", "À 5-6 sur 10, je remarque…", "À 8-9 sur 10, je ressens…"] } },
  { m: 0, t: "Nommer, c'est apaiser", why: "Mettre un mot précis sur une émotion calme le cerveau : la partie qui réfléchit reprend un peu la main sur celle qui s'emballe.",
    ex: { k: "chips", txt: "Choisis les mots qui décrivent ce que tu ressens le plus souvent en ce moment.", opts: EMOS, key: "emos" } },
  { m: 0, t: "Mes signaux d'alerte", why: "Le corps prévient souvent avant que l'émotion déborde. Connaître tes signaux, c'est pouvoir agir plus tôt.",
    ex: { k: "chips", txt: "Quels signaux ton corps t'envoie quand ça commence à monter ?", opts: ["Cœur qui bat vite", "Gorge serrée", "Boule au ventre", "Chaleur au visage", "Mâchoire serrée", "Larmes", "Souffle court", "Mains qui tremblent", "Envie de fuir", "Tête qui tourne", "Je me ferme", "J'ai envie de crier"], key: "signals", q: ["Les situations qui déclenchent souvent ça chez moi :"] } },
  { m: 1, t: "La cohérence cardiaque", why: "Respirer 6 fois par minute (5 secondes pour inspirer, 5 pour expirer) calme le cœur et le stress en quelques minutes. Utilisé en sophrologie : 3 fois par jour, ça installe un calme de fond.",
    ex: { k: "breath", pat: [5, 0, 5, 0], min: 3 } },
  { m: 1, t: "La respiration carrée", why: "Inspirer, bloquer, expirer, bloquer : 4 temps égaux. Compter occupe l'esprit et le souffle ralentit tout seul. Pratique en cours ou dans le bus, personne ne le voit.",
    ex: { k: "breath", pat: [4, 4, 4, 4], min: 2 } },
  { m: 1, t: "Serrer pour relâcher", why: "On contracte un muscle quelques secondes puis on relâche : le corps découvre la différence entre tendu et détendu. Très efficace avant de dormir.",
    ex: { k: "audio", id: "serrer" } },
  { m: 1, t: "Le scan du corps", why: "Exercice de sophrologie : on promène son attention dans le corps, sans rien changer. Ça ramène dans le présent et ça apaise les pensées qui tournent.",
    ex: { k: "audio", id: "scan" } },
  { m: 1, t: "Mon endroit calme", why: "Le cerveau réagit à ce qu'on imagine presque comme à ce qu'on vit. Un endroit calme bien imaginé devient un refuge où tu peux aller en 30 secondes.",
    ex: { k: "read", audio: "endroit", txt: "Ferme les yeux et imagine un endroit où tu te sens bien et en sécurité, réel ou inventé. Puis décris-le avec tes 5 sens.", q: ["C'est où ?", "Ce que je vois et ce que j'entends :", "Ce que je sens (odeurs, température, sur la peau) :"] } },
  { m: 2, t: "La règle des 10 minutes", why: "Une envie très forte (crier, partir, se faire du mal) est au plus haut au début puis baisse. Attendre 10 minutes en faisant autre chose laisse passer le pic.",
    ex: { k: "timer", sec: 600, txt: "Lance le minuteur et fais autre chose en attendant : respire, bouge, écoute une musique, parle à quelqu'un. À la fin, regarde où tu en es sur 10." } },
  { m: 2, t: "Le froid qui calme", why: "Le froid sur le visage (eau très froide, glaçon dans la main) ralentit le cœur en quelques secondes : c'est un réflexe du corps. Un des moyens les plus rapides de faire redescendre une crise.",
    ex: { k: "timer", sec: 30, txt: "Passe de l'eau très froide sur ton visage, ou tiens un glaçon dans ta main, pendant 30 secondes. Respire lentement en même temps." } },
  { m: 2, t: "Bouger fort, 1 minute", why: "Une émotion très forte remplit le corps d'énergie. La dépenser vite (boxer dans un coussin, pousser un mur de toutes ses forces) la fait retomber. Pas besoin de sauter.",
    ex: { k: "timer", sec: 60, txt: "Boxe dans un coussin, pousse un mur de toutes tes forces ou fais des pompes contre le mur, à fond, pendant 1 minute. Puis respire lentement." } },
  { m: 2, t: "5-4-3-2-1 : revenir ici", why: "Quand l'angoisse emporte tout, nommer ce qui est autour de soi ramène l'esprit dans le présent, là où tu es en sécurité.",
    ex: { k: "ground" } },
  { m: 2, t: "Ma boîte de secours", why: "En pleine crise, on n'arrive pas à réfléchir. Choisis maintenant, au calme, ce qui t'aide : ta liste sera dans le bouton SOS.",
    ex: { k: "chips", txt: "Ce qui peut m'aider quand ça monte (choisis-en plusieurs, ajoute les tiennes) :", opts: ["Écouter ma playlist", "Prendre une douche", "Tenir un glaçon", "Serrer une balle", "Dessiner / gribouiller", "Sortir marcher", "Appeler quelqu'un", "Câliner mon animal", "Regarder une série", "Écrire ce que je ressens", "Danser", "Me rouler dans une couverture", "Chanter fort", "Jouer à un jeu", "Travailler sur mon cosplay", "Dessiner un personnage", "Regarder mon anime préféré", "Écouter un opening que j'adore", "Feuilleter mes photos de cosplay"], key: "box", custom: true } },
  { m: 3, t: "Les pièges à pensées", why: "Quand on va mal, le cerveau tombe dans des pièges : tout voir en noir, deviner ce que pensent les autres, imaginer le pire. Les reconnaître leur enlève beaucoup de force.",
    ex: { k: "chips", txt: "Lesquels tu reconnais chez toi ?", opts: ["Tout ou rien (« c'est nul, je rate tout »)", "Lire dans les pensées (« elle me trouve bizarre »)", "La catastrophe (« ça va être horrible »)", "L'étiquette (« je suis nulle »)", "Toujours / jamais (« ça m'arrive toujours »)", "Tout est de ma faute", "Je le sens donc c'est vrai", "Ne voir que le négatif"], key: "traps" } },
  { m: 3, t: "Démêler une pensée", why: "Écrire une pensée qui fait mal et la regarder comme une hypothèse, pas comme une vérité, fait souvent baisser l'émotion.",
    ex: { k: "thought" } },
  { m: 3, t: "La voix de la meilleure amie", why: "On est souvent bien plus dure avec soi qu'avec les autres. Se parler comme à une amie qu'on aime change tout.",
    ex: { k: "read", audio: "douceur", txt: "Pense à quelque chose qui te fait te sentir nulle ou coupable en ce moment.", q: ["Ce que je me dis dans ma tête :", "Ce que je dirais à ma meilleure amie si elle vivait la même chose :", "Une phrase gentille que je peux me redire :"] } },
  { m: 4, t: "Une lettre pour moi", why: "S'écrire avec douceur, comme on écrirait à quelqu'un qu'on aime, aide à se sentir moins seule face à ce qu'on vit.",
    ex: { k: "read", txt: "Écris-toi quelques lignes, avec bienveillance. Tu peux commencer par « Je sais que c'est dur en ce moment… ».", q: ["Ma lettre :"] } },
  { m: 4, t: "Mes 3 victoires du jour", why: "Le cerveau retient d'abord le négatif. Noter chaque soir 3 petites choses réussies ou agréables l'entraîne à voir aussi le reste. À refaire souvent !",
    ex: { k: "wins" } },

  else if (ex.k === "read") { box.innerHTML = `${ex.audio ? `<p class="small mute">Tu peux d'abord écouter la séance guidée, puis écrire ce qui t'est venu.</p>${sessBtn(ex.audio)}` : ""}<h3>✍️ À toi</h3><p>${esc(ex.txt)}</p>${qs}<p class="small mute">C'est enregistré tout seul, seulement sur ton téléphone.</p>`; bindQs(); }

  else if (ex.k === "breath") breath(box, ex.pat, ex.min);
  else if (ex.k === "guide") guide(box, ex.steps);
  else if (ex.k === "timer") timerEx(box, ex.sec, ex.txt);
  else if (ex.k === "ground") ground(box, A);

function breath(box, pat, min, names = ["Inspire", "Bloque", "Expire", "Bloque"]) {
  box.innerHTML = `<div class="breath"><div class="bubble" id="bub"></div><div class="bword" id="bw">Prête ?</div></div><div class="big" id="bt">${min}:00</div><div class="chips" style="justify-content:center">${voiceChip()}</div><button class="btn" id="bgo">▶ Commencer</button>`;

  const f = inp.files && inp.files[0]; if (!f) return; const r = new FileReader();
  r.onload = () => { try { const d = JSON.parse(r.result); if (!d || typeof d !== "object" || !Array.isArray(d.journal)) throw 0;
      if (!confirm("Remplacer les données de ce téléphone par cette sauvegarde ?")) return;
      localStorage.setItem(K, JSON.stringify(d)); location.reload(); } catch (e) { toast("Ce fichier n'est pas une sauvegarde Ma Bulle"); } };
  r.readAsText(f);
}

// ---------------------------------------------------------------- journal
function journal() {
  if (cur === "new") return `<h1>Écrire</h1><div class="card">
    <label>Ce que je ressens (choisis)</label><div class="chips" id="jemo">${EMOS.map(e => `<button class="chip">${e}</button>`).join("")}</div>
    <label>Force : <b id="jnv">5</b> / 10</label><input type="range" min="0" max="10" value="5" id="jn" oninput="$('#jnv').textContent=this.value">
    <label>Ce qui s'est passé</label><textarea id="jsit"></textarea>
    <label>Ce que j'ai fait, ce qui m'a aidée</label><textarea id="jtxt"></textarea>
    <button class="btn" onclick="saveEntry()">Garder</button><button class="btn alt" onclick="go('journal')">Annuler</button></div>`;
  return `<h1>Mon journal</h1><p class="mute small">🔒 Rien que pour toi, il reste sur ton téléphone.</p><button class="btn" onclick="go('journal','new')">✍️ Écrire maintenant</button>
  ${S.journal.length ? S.journal.map((e, k) => `<div class="card"><div class="row"><span class="badge">${fmtD(e.d)}</span>${e.emo ? `<span class="badge">${esc(e.emo)}</span>` : ""}<span class="badge">${e.kind === "pensée" ? "🧶 " + e.n + " → " + e.n2 : e.kind === "envie" ? "🌊 " + e.n + " → " + e.n2 : e.n + "/10"}</span><span class="grow"></span><button class="chip" onclick="delEntry(${k})">🗑</button></div>
    ${e.sit ? `<p>${esc(e.sit)}</p>` : ""}${e.txt ? `<p class="mute" style="white-space:pre-wrap">${esc(e.txt)}</p>` : ""}</div>`).join("") : `<p class="mute">Ton journal est vide pour l'instant.</p>`}`;
}
function saveEntry() { const emo = [...document.querySelectorAll("#jemo .chip.on")].map(c => c.textContent).join(", ");
  S.journal.unshift({ d: today(), kind: "note", emo, n: +$("#jn").value, sit: $("#jsit").value, txt: $("#jtxt").value }); save(); toast("Gardé 📔"); go("journal"); }
document.addEventListener("click", e => { if (e.target.closest("#jemo .chip")) e.target.classList.toggle("on"); });
function delEntry(k) { if (confirm("Supprimer ce moment du journal ?")) { S.journal.splice(k, 1); save(); render(); } }

// ---------------------------------------------------------------- progrès
function progress() {
  const days = Object.keys(S.mood).length, d = doneCount(), w = Object.values(S.wins).filter(x => x.some(Boolean)).length;
  return `<h1>Mes progrès 🌱</h1>${lvlCard()}<button class="btn soft" onclick="go('seance')">📋 Préparer ma séance avec mon psy</button><div class="card"><h3>Ma météo des 14 derniers jours</h3><canvas id="ch" width="600" height="180"></canvas><p class="small mute">⛈️ en bas, ☀️ en haut. Les jours difficiles font partie du chemin.</p></div>
  <div class="card"><div class="row"><div class="grow"><div class="big" style="font-size:32px">${d}</div><p class="small mute" style="text-align:center">étapes faites</p></div>
  <div class="grow"><div class="big" style="font-size:32px">${days}</div><p class="small mute" style="text-align:center">jours de météo</p></div>
  <div class="grow"><div class="big" style="font-size:32px">${w}</div><p class="small mute" style="text-align:center">jours de victoires</p></div></div></div>
  ${insight()}
  <div class="card"><h3>💬 Pour toi</h3><p>${d === 0 ? "Chaque grand chemin commence par une petite étape. La première prend 5 minutes." : d < 10 ? "Tu avances, une étape après l'autre. C'est exactement comme ça que ça marche." : "Regarde tout ce que tu as déjà appris. Tu peux être fière de toi."}</p></div>`;
}
function insight() {
  const pairs = Object.keys(S.mood).map(d => [S.mood[d].v, S.day[d] && S.day[d].sleep]).filter(p => p[1]);
  const lo = pairs.filter(p => p[1] < 7).map(p => p[0]), hi = pairs.filter(p => p[1] >= 7).map(p => p[0]);
  if (lo.length < 3 || hi.length < 3) return `<div class="card"><h3>🔎 Ce qui m'influence</h3><p class="small mute">Remplis « Ma journée » quelques jours : je te montrerai le lien entre ton sommeil et ta météo.</p></div>`;
  const a = x => x.reduce((s, v) => s + v, 0) / x.length, dl = a(hi) - a(lo);
  return `<div class="card"><h3>🔎 Ce qui m'influence</h3><p>${dl > 0.4 ? `Les jours où tu as dormi <b>7 h ou plus</b>, ta météo est nettement meilleure (${MOODS[Math.round(a(hi))]} contre ${MOODS[Math.round(a(lo))]}). Le sommeil est un vrai super-pouvoir pour toi.` : "Pour l'instant, ton sommeil ne semble pas changer beaucoup ta météo. Continue à noter, on verra avec plus de jours."}</p></div>`;
}
function drawChart() {
  const c = $("#ch"); if (!c) return; const x = c.getContext("2d"), W = c.width, H = c.height; x.clearRect(0, 0, W, H);
  const ds = [...Array(14)].map((_, i) => { const d = new Date(); d.setDate(d.getDate() - 13 + i); return ymd(d); });
  const bw = W / 14;
  ds.forEach((d, i) => { const m = S.mood[d]; x.fillStyle = "rgba(255,255,255,.07)"; x.fillRect(i * bw + 6, 10, bw - 12, H - 40);
    if (m) { const h = (m.v + 1) / 5 * (H - 40); const g = x.createLinearGradient(0, H - 30 - h, 0, H - 30); const cs = getComputedStyle(document.body); g.addColorStop(0, cs.getPropertyValue("--acc2").trim() || "#b79bff"); g.addColorStop(1, cs.getPropertyValue("--acc").trim() || "#7fe0d0"); x.fillStyle = g; x.fillRect(i * bw + 6, H - 30 - h, bw - 12, h);
      x.font = "22px sans-serif"; x.textAlign = "center"; x.fillText(MOODS[m.v], i * bw + bw / 2, H - 34 - h); }
    x.fillStyle = "#b9b3d6"; x.font = "15px sans-serif"; x.textAlign = "center"; x.fillText(new Date(d + "T12:00").getDate(), i * bw + bw / 2, H - 8); });
}

// ---------------------------------------------------------------- réglages
function settings() {
  return `<h1>Moi</h1><div class="card">
  <label>Mon prénom</label><input type="text" id="sn" value="${esc(S.name)}">
  <label>Ma personne de confiance (son prénom)</label><input type="text" id="stn" value="${esc(S.trustName)}" placeholder="ex. Papa">
  <label>Son numéro</label><input type="tel" id="stt" value="${esc(S.trustTel)}" placeholder="06…">
  <label>🎵 Ma playlist qui m'apaise (lien Spotify, Deezer, YouTube…)</label><input type="text" id="smu" value="${esc(S.music)}" placeholder="Colle le lien ici">
  <button class="btn" onclick="saveSet()">Enregistrer</button></div>
  ${VOICE.ok ? `<div class="card"><h3>🎧 La voix qui me guide</h3><p class="small mute">Elle lit les exercices de relaxation et de respiration à voix haute.</p><div class="chips">${voiceChip()}</div></div>` : ""}
  <div class="card"><h3>🎨 Mon thème</h3><div class="chips">
    <button class="chip ${S.theme === "miku" ? "on" : ""}" onclick="S.theme='miku';save();render()">🎤 Miku (turquoise)</button>
    <button class="chip ${S.theme !== "miku" ? "on" : ""}" onclick="S.theme='bulle';save();render()">🫧 Bulle (violet)</button></div></div>
  <div class="card"><h3>🔒 Code secret</h3><p class="small mute">Pour que personne d'autre ne puisse ouvrir ton journal. 4 chiffres.</p>
  <input type="password" inputmode="numeric" maxlength="4" id="spin" placeholder="${S.pin ? "••••  (laisse vide pour garder)" : "Aucun code"}">
  <button class="btn alt" onclick="savePin()">${S.pin ? "Changer le code" : "Mettre un code"}</button>${S.pin ? `<button class="btn alt" onclick="S.pin='';save();toast('Code retiré');render()">Retirer le code</button>` : ""}</div>
  <div class="card"><h3>⏰ Un petit rappel chaque soir</h3><p class="small mute">Pour penser à ta météo et à tes victoires. Le rappel s'appelle juste « Ma Bulle » : personne ne saura de quoi il s'agit.</p>
  <label>À quelle heure ?</label><input type="time" id="rh" value="${esc(S.remind || "20:00")}">
  <button class="btn alt" onclick="addReminder()">📅 Ajouter à mon agenda</button>
  <p class="small mute">Si ça ne marche pas sur ton téléphone : mets une alarme tous les jours dans l'appli Horloge, nommée « Ma Bulle ».</p></div>
  <div class="card"><h3>💾 Sauvegarder mes données</h3><p class="small mute">Tout est seulement sur ce téléphone. Fais une sauvegarde de temps en temps pour ne rien perdre si tu changes de téléphone. ⚠️ Le fichier contient ton journal : garde-le pour toi, dans tes fichiers ou ton drive perso.</p>
  ${S.lastBackup ? `<p class="small">Dernière sauvegarde : ${fmtD(S.lastBackup)}</p>` : ""}
  <button class="btn alt" onclick="exportData()">💾 Faire une sauvegarde</button>
  <label class="btn alt" style="text-align:center">📂 Récupérer une sauvegarde<input type="file" accept=".json,application/json" style="display:none" onchange="importData(this)"></label></div>
  <div class="card"><h3>📲 L'installer comme une appli</h3><p class="small mute">iPhone : bouton Partager ⬆️ puis « Sur l'écran d'accueil ». Android : menu ⋮ puis « Installer l'application ».</p></div>
  <div class="card"><h3>💜 À savoir</h3><p class="small">Ma Bulle t'aide entre les séances, mais elle ne remplace pas ton psy. N'hésite pas à lui montrer ton parcours et ton plan de secours.</p><p class="small mute">Tout reste sur ce téléphone : rien n'est envoyé sur Internet.</p></div>`;
}
function saveSet() { S.name = $("#sn").value.trim(); S.trustName = $("#stn").value.trim(); S.trustTel = $("#stt").value.replace(/[^\d+]/g, ""); S.music = $("#smu").value.trim(); save(); toast("Enregistré ✓"); }
function savePin() { const p = $("#spin").value; if (/^\d{4}$/.test(p)) { S.pin = p; save(); toast("Code enregistré 🔒"); render(); } else toast("Il faut 4 chiffres"); }

// ---------------------------------------------------------------- SOS
function openSOS() {
  stopTimers(); const o = $("#sos"); o.classList.remove("hidden");
  const box = S.box.length ? S.box : ["Écouter ma playlist", "Prendre une douche", "Tenir un glaçon", "Appeler quelqu'un"];
  o.innerHTML = `<div class="inner"><div class="row"><h1 class="grow">Je suis là 🫧</h1><button class="chip" onclick="closeSOS()">✕ Fermer</button></div>
  ${S.theme === "miku" ? `<div class="mascot"><img src="miku-douce.png" alt=""><div class="say">On y va ensemble, doucement. Tu n'es pas seule 💙</div></div>` : ""}
  <p>Tu traverses un moment très dur. <b>Ça va redescendre.</b> On y va une chose à la fois.</p>
  <button class="btn warm" onclick="closeSOS();goUrge()">🌊 J'ai envie de me faire du mal</button>
  <div class="card"><h3>1. Respire avec la bulle</h3><div id="sosb"></div>
    ${SEANCES.envie ? `<button class="btn soft" onclick="closeSOS();openSess('envie',()=>{go('home');openSOS()})">🎧 Ou une voix pour m'accompagner (${Math.round(SEANCES.envie.d / 60)} min)</button>` : ""}</div>
  <div class="card"><h3>2. Fais redescendre vite</h3>
    <button class="btn" onclick="sosT('🧊 Eau très froide sur le visage, ou un glaçon dans la main. Respire lentement.',30)">🧊 Le froid, 30 s</button>
    <button class="btn soft" onclick="sosT('🏃 Pousse un mur ou boxe dans un coussin, de toutes tes forces. Laisse sortir l\\'énergie.',60)">🏃 Bouger fort, 1 min</button>
    <button class="btn alt" onclick="sosT('⏳ Attends 10 minutes en faisant autre chose. L\\'envie va baisser.',600)">⏳ Attendre 10 min</button>
    <div class="big" id="sost" style="font-size:30px"></div><p class="small" id="sostx"></p></div>
  <div class="card"><h3>3. Ce qui m'aide</h3>${S.music ? `<a class="tel" href="${esc(S.music)}" target="_blank" rel="noopener"><div><b>🎵 Ma playlist qui m'apaise</b><br><span>L'écouter maintenant</span></div><span>›</span></a>` : ""}<div class="chips">${box.map(b => `<span class="chip">${esc(b)}</span>`).join("")}</div>
  ${S.plan.self ? `<p class="small mute" style="white-space:pre-wrap">${esc(S.plan.self)}</p>` : ""}${(S.ans.t_hero || {})[4] ? `<p class="small"><b>🎭 ${esc((S.ans.t_hero || {})[0] || "Mon personnage")} me dirait :</b> <span style="white-space:pre-wrap">${esc(S.ans.t_hero[4])}</span></p>` : ""}${S.plan.why ? `<p class="small"><b>Mes raisons :</b> <span style="white-space:pre-wrap">${esc(S.plan.why)}</span></p>` : ""}</div>
  <div class="card"><h3>4. Parler à quelqu'un</h3>
    ${S.trustTel ? `<a class="tel" href="tel:${esc(S.trustTel)}"><div><b>📞 ${esc(S.trustName || "Ma personne de confiance")}</b><br><span>Appeler maintenant</span></div><span>›</span></a>
    <a class="tel" href="sms:${esc(S.trustTel)}?&body=${encodeURIComponent("Ça ne va pas trop, tu peux m'appeler ou venir me voir ?")}"><div><b>💬 Lui envoyer un message tout prêt</b><br><span>Si tu n'arrives pas à parler</span></div><span>›</span></a>` : `<p class="small mute">Ajoute ta personne de confiance dans « Moi ».</p>`}
    <a class="tel" href="tel:0800235236"><div><b>📞 Fil Santé Jeunes · 0 800 235 236</b><br><span>Gratuit, anonyme, 12-25 ans</span></div><span>›</span></a>
    <a class="tel" href="https://www.filsantejeunes.com/" target="_blank" rel="noopener"><div><b>⌨️ Fil Santé Jeunes par tchat</b><br><span>Pour écrire au lieu de parler</span></div><span>›</span></a>
    <a class="tel" href="tel:3114"><div><b>💜 3114</b><br><span>Si tu as des idées de mourir · gratuit, 24 h/24</span></div><span>›</span></a>
    <a class="tel" href="tel:112"><div><b>🚑 112</b><br><span>Urgence, si tu es en danger ou blessée</span></div><span>›</span></a>
  </div></div>`;
  breath($("#sosb"), [4, 0, 6, 0], 3);
}
function sosT(txt, sec) { stopTimers(); breath($("#sosb"), [4, 0, 6, 0], 3); $("#sostx").textContent = txt; const end = Date.now() + sec * 1000; vib(30);
  timers.push(setInterval(() => { const r = Math.max(0, end - Date.now()), e = $("#sost"); if (!e) return; e.textContent = Math.floor(r / 60000) + ":" + String(Math.ceil(r / 1000) % 60).padStart(2, "0"); if (r <= 0) { stopTimers(); e.textContent = "💪 Bravo, tu l'as fait"; vib([30, 60, 30]); } }, 250)); }
function closeSOS() { stopTimers(); $("#sos").classList.add("hidden"); render(); }

// ---------------------------------------------------------------- code secret
function lockScreen() {
  let p = ""; const L = $("#lock"); L.classList.remove("hidden");
  const draw = () => L.innerHTML = `<div style="text-align:center"><div style="font-size:48px">🫧</div><h2>Ma Bulle</h2><p class="mute">Ton code secret</p>
    <div class="pin">${[0, 1, 2, 3].map(i => `<i class="${i < p.length ? "f" : ""}"></i>`).join("")}</div>
    <div class="pad">${[1, 2, 3, 4, 5, 6, 7, 8, 9, "", 0, "⌫"].map(k => k === "" ? "<span></span>" : `<button data-k="${k}">${k}</button>`).join("")}</div>
    <button class="btn sos" style="max-width:240px" onclick="openSOS()">🆘 SOS sans code</button></div>`;
  draw();
  L.onclick = e => { const k = e.target.dataset && e.target.dataset.k; if (k === undefined) return; vib(10);
    if (k === "⌫") p = p.slice(0, -1); else if (p.length < 4) p += k;
    if (p.length === 4) { if (p === S.pin) { L.classList.add("hidden"); return; } p = ""; vib([60, 40, 60]); }
    draw(); };
}
// ---------------------------------------------------------------- petit message
function toast(m) { const t = document.createElement("div"); t.textContent = m;
  t.style.cssText = "position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:#2d2550;border:1px solid rgba(255,255,255,.2);color:#fff;padding:10px 16px;border-radius:12px;z-index:40;font-size:14px";
  document.body.appendChild(t); setTimeout(() => t.remove(), 2200); }

render();
if (S.pin) lockScreen();
// le journal se reverrouille si l'appli reste en arrière-plan plus d'une minute
let hiddenAt = 0;
document.addEventListener("visibilitychange", () => {
  if (document.hidden) hiddenAt = Date.now();
  else if (S.pin && hiddenAt && Date.now() - hiddenAt > 60000 && $("#lock").classList.contains("hidden")) lockScreen();
});
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
